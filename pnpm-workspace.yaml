packages:
  - "apps/*"
  - "evals"
  - "crates/tripwire-core"
allowBuilds:
  esbuild: true
overrides:
  fast-uri: ">=4.1.2"
  js-yaml: ">=4.3.0"
  nanoid@<3.3.17: "^3.3.17"

# Supply-chain cooldown: never resolve a version younger than a day. Dependabot's
# pnpm applies the same gate, so a lockfile that ignores it fails its runs
# (ERR_PNPM_NO_MATURE_MATCHING_VERSION on fast-uri 4.1.4, 2026-09-02).
minimumReleaseAge: 1440
